# The game people play: Space Trucking's Bevy first-person cabin. A member
# of the root workspace since the 2D console retired (docs/BAY.md) — the
# ALSA links collision left with macroquad, and the lint table and build
# profiles now live at the workspace root.
[package]
name = "cabin"
version = "0.1.0"
edition = "2024"
rust-version = "1.95" # Bevy 0.19's floor; the root library still builds on 1.85
authors = ["Cassidy Prather <pratherea@gmail.com>"]
description = "Space Trucking's 3D cabin — the Bevy first-person frontend"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CassidyPrather/space-trucking"
keywords = ["game", "gamedev", "bevy", "3d", "space"]
categories = ["games"]
publish = false

# The binary keeps the game's own name: releases ship `space-trucking`,
# whatever the package that builds it is called.
[[bin]]
name = "space-trucking"
path = "src/main.rs"

# Purchased art is the default build. The cabin reads converted Synty
# meshes from the art cache (`cargo xtask art resolve`, docs/ART_PIPELINE.md)
# and falls back to the code-cut whitebox for anything the cache does not
# have — including the whole game, when there is no cache at all, which is
# what CI and a fresh clone see.
#
# `--features whitebox` is the development alternative: it compiles the
# loading half out entirely, so the build draws only what this repository
# cuts in code and never opens the cache.
[features]
default = []
whitebox = []

[dependencies]
# The whole game, headless: sim, net, replay, synth, telemetry.
space-trucking = { path = "../.." }
# The engine, cut to what the cabin actually draws. The default set is
# four umbrella features — 2d, 3d, ui, audio — and they carry passengers
# this game never boards: no animation, no scene files, no sprites, and
# the only sound is synth.rs's WAV bytes. Each line below answers to
# something on screen.
bevy = { version = "0.19", default-features = false, features = [
    # App and platform: what DefaultPlugins is assembled out of.
    "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
    "bevy_state", "reflect_auto_register", "bevy_winit", "x11", "wayland",
    # The 3D pass: PBR materials, point lights (no shadow maps), and the
    # bloom the lamps and the CRTs are lit with.
    "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_light",
    "bevy_post_process", "bevy_camera", "bevy_mesh", "bevy_material",
    "bevy_shader", "bevy_color", "bevy_image", "bevy_window",
    # A Camera3d tonemaps through TonyMcMapface unless told otherwise, and
    # the LUT it reads is a zstd-compressed ktx2. Drop these three and
    # every frame in the game comes out a different colour.
    "tonemapping_luts", "ktx2", "zstd_rust",
    # `png` writes `--shot` screenshots and reads the textures embedded in
    # converted art. `--shot` saves through the same format registry, and
    # without this every screenshot run exits 0 having written a
    # zero-byte file ("The image format `Png` is not supported").
    "png",
    # The Esc menu: text nodes, and the picking backend that drives the
    # `Interaction` they are clicked through.
    "bevy_ui", "bevy_ui_render", "bevy_text", "default_font",
    "bevy_input_focus", "bevy_picking", "ui_picking",
    # The soundscape arrives as synth.rs's WAV bytes, so wav and nothing
    # else: no vorbis, no audio files.
    "bevy_audio", "wav",
    # Purchased art: the glTF loader the converted Synty meshes come in
    # through (it brings `bevy_world_serialization`, which spawns them).
    # Their textures are embedded PNG, which `png` above already reads.
    "bevy_gltf",
] }
# The deep-night window for the Umbra Market, read from the OS clock.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The wall clock the save stamps and the fresh seed are read from. On
# native this crate is a re-export of `std::time`, byte for byte; on
# wasm32-unknown-unknown `std::time::SystemTime::now()` is a panic
# ("time not implemented on this platform") and this reads
# `Date.now()` instead. Already in Bevy's graph under its `web` feature.
web-time = "1"

# **What a browser build adds, and only a browser build.** Cargo unions
# these features with the tables above when the target is wasm32, and
# ignores them otherwise, so a native build's graph is byte for byte what
# it was: this table cannot change what `cargo build` ships.
#
# Nothing else is needed to compile: the sim library was the retired 2D
# console's wasm payload and never stopped being one, and the cabin
# type-checked for wasm32 on the first try with just these two Bevy
# features. `x11` and `wayland` above are Linux-gated inside winit and
# cost a wasm build nothing.
#
# This is the compile, not the deploy: a browser build still wants
# wasm-bindgen's loader and a page to sit in, its saves go nowhere
# (`std::fs` fails, silently by design — see bridge.rs), and the art
# seam reads its index through `std::fs` too, so it draws the whitebox.
# docs/DEPLOYING.md carries the list.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `web`: wasm-bindgen, js-sys, and the platform shims (web-time above is
# one of them). `webgl2`: the wgpu backend every current browser has;
# `webgpu` is the faster, narrower one, and can join it later.
bevy = { version = "0.19", default-features = false, features = ["web", "webgl2"] }
# chrono's local clock comes from `Date` on wasm only with `wasmbind`;
# without it, the Umbra Market's opening-hours check panics the first
# time it is asked, the way `SystemTime::now()` does.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }

[lints]
workspace = true
