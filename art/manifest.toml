# THE GUILD'S HANGAR LIGHT, and it is the first body in this file that
# GLOWS.
#
# A slim housing with a row of five square panels in it — a corridor
# strip, which is what a line of light leaking over a cornice is. The
# `emissive` line beside the atlas is the whole mechanism: Synty ship a
# second image laid out on the same swatch grid as the colour one, black
# everywhere the mesh is not lit and the lamp's colour where it is, and
# the converter wires it into emission alone (`light_with` in
# xtask/blender/fbx_to_gltf.py). So this lights exactly the five panels
# and nothing else on the housing.
#
# **What it gives up is the violet.** The whitebox strip burns `EERIE`
# because the Guild's hangar is violet; the pack's own lamps burn the
# pack's own colour, and repainting a bought material is throwing away
# the thing that was bought (docs/ART_DIRECTION_3D.md, "Two voices").
# What survives is the reading, which was never the hue on its own: a
# lit line over the aft cornice, at a height nothing else in the room
# reaches, saying that whatever is through that wall has its own
# electricity.
#
# This is the counter-example to the paragraph above about lit fittings,
# and the paragraph stands for the rest of them. A strip light is a
# thing a pack sells. A beacon whose whole meaning is the Guild's own
# violet, a candle, a grow strip at the end of its life, the seam of
# light leaking round a shut tin — those are colours doing a job, and no
# atlas anybody sells is going to do that job.
[asset.hangar_strip]
pack = "scifi_space"
source = "SourceFiles/FBX/SM_Prop_Detail_Lights_02.fbx"
texture = "SourceFiles/Textures/PolygonSciFiSpace_Texture_01_A.png"
emissive = "SourceFiles/Textures/PolygonSciFiSpace_Emissive_01.png"
sha256 = "e11a49c0a55506cc9cf82c63fc4646e996e39359203a8deb0fc75454771ffc84"
scale = [1.980151, 20.000000, 6.855372]
offset = [0.0, 0.0, 0.0]
