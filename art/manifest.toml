# ---------------------------------------------------------------------
# Assets
#
# One table per referenced asset. The table name is the STABLE ID: it is
# what code will name, so re-cutting a fitting out of a different pack
# stays an edit to this file.
#
#   pack      which [pack.*] above it comes out of
#   source    where it is in that pack, relative to the pack directory,
#             written with `/` on every platform. Prefer the Source Files
#             download: it holds the FBX and the textures directly, and
#             the .unitypackage route below is for packs that ship no
#             source download.
#   unity     optional. The project-relative path (`Assets/...`) the same
#             asset has INSIDE a .unitypackage, used only when `source`
#             is not there. Rebuilding that archive is done for you.
#   texture   optional, and usually needed. A Synty pack paints itself
#             from one shared atlas, and this line DECLARES which one. It
#             is handed to the converter, which paints every material
#             that names no image of its own with it — because Synty
#             assign their materials in Unity, so the FBX itself commonly
#             names nothing and a mesh converted on its word comes out
#             grey. An FBX that DOES name its own texture still wins: the
#             atlas is also staged beside the mesh, where a relative
#             reference out of the original tree resolves against it.
#   sha256    the digest of the bytes this line was written against.
#             Leave it out until you have the pack; `cargo xtask art hash`
#             prints the line to paste. Once it is set, a pack update
#             that changes the file is a refusal with both digests in it
#             rather than a mesh that quietly became a different mesh.
#
# Then the four overrides. They are here from the first day and nothing
# consumes them yet, which is deliberate: `poi::Shape::fill` arrived
# AFTER five stations had already written hoops that could not reach
# their own deck, and the whole cost of that was the field not existing
# when the descriptions were authored.
#
#   scale     multiplied onto the size the game's description asks for.
#             An FBX arrives at whatever unit its exporter chose and the
#             converter is deliberately not allowed to guess, so the
#             correction lives here, on a line you can comment.
#   offset    shifted in the description's own frame, after scaling.
#   rotation  degrees about x, y, z.
#   fill      what fraction of its drawing frame the mesh actually
#             occupies, per axis — the same number, meaning the same
#             thing, as `poi::Shape::fill`. A description claims a box; a
#             purchased mesh occupies some part of it, and every rule
#             that measures a body is measuring the frame until this says
#             otherwise.
#
# All four default to the identity: scale [1,1,1], offset [0,0,0],
# rotation [0,0,0], fill [1,1,1]. That default is a CLAIM — that the mesh
# is exactly the box the description asks for — and it is the claim most
# imported meshes turn out to break.
#
# To add one, with the packs under $SYNTY_STORE — as downloaded, nothing
# unzipped:
#
#     cargo xtask art find crate      # what is actually in the packs
#     # paste the pack and source lines it prints into a table below
#     cargo xtask art hash            # paste the sha256 line it prints
#     cargo xtask art resolve
#
# The table below is one that has been through that, against real packs.
# Copy its shape rather than an invented one: every path in it is a path
# that exists, and `find` is what knew them.
# ---------------------------------------------------------------------

