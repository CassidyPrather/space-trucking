# The art manifest: everything this repository is allowed to know about
# art it is not allowed to carry.
#
# Synty's licence lets their meshes ship inside a BUILT GAME and forbids
# redistributing them as SOURCE. A public repository is source. So the
# meshes are not here, will not be here, and would not be here even in
# LFS — what is here is a set of references, and `cargo xtask art resolve`
# turns them into files on the machine of whoever holds the licence.
#
#     art/manifest.toml   this file: ids, packs, paths, digests, overrides
#     $SYNTY_STORE        the packs exactly as downloaded, on your disk
#     art/cache/          the few files this file names, converted; gitignored
#     art/dex/            what the meshes in those packs look like, in English,
#                         so a pack can be searched by more than its file names.
#                         `cargo xtask art describe` writes it; it is in git,
#                         because names, counts and English are not art.
#
# Nothing in continuous integration reads this file. CI builds the
# whitebox — the geometry the game cuts in code — because that is the
# version whose payload is in the repository. See docs/ART_PIPELINE.md.
#
# The format is a strict subset of TOML: comments, `[table.id]` headers,
# and `key = value` where a value is a quoted string or three numbers.
# Anything else is an error naming the line, so a mistyped key is a
# refusal rather than an override that silently never applied.


# ---------------------------------------------------------------------
# Packs
#
# One table per pack you have bought. `dir` is YOUR directory name under
# $SYNTY_STORE, not a guess at what Synty's zip unpacks to: this line is
# the contract, so nothing has to predict a download's naming, and moving
# your packs around is an edit here rather than a code change. Spaces and
# capitals in it are ordinary; the name the store gave the pack is a fine
# name for the directory you drop the download into.
#
# `title` and `download` are English, and they exist for exactly one
# moment — the one where somebody clones this on a machine with no packs
# on it and has to be told which thing to go and get.
# ---------------------------------------------------------------------

