# The rest of the cargo, in `Kind::index` order. Every line below came out
# of `cargo xtask art dex` — the catalogue is what knew which of a hundred
# files called `SM_Prop_Crate_0N` was the one worth naming here.
#
# Not dressed, and each for a stated reason: the three lamps and the
# luminous paint own a real `PointLight` that lights the ROOM, and a
# purchased mesh replaces a description rather than joining it
# (`pieces::build_kind`), so dressing one puts the bay in the dark; the
# window, porthole and bay window frame a rendered viewport a solid body
# would occlude; and the chart tank, ETA gauge, destination preview and
# launch lever are the game's instruments, which is the UI.

