# One workspace, two packages: this root package is the pure game library
# (sim, net, replay, synth, telemetry) that runs headless in tests and
# benches, and crates/cabin is the Bevy first-person frontend — the game
# people play. The workspaces merged when the 2D macroquad console retired
# (see docs/BAY.md): the `links = "alsa"` collision between quad-alsa-sys
# and Bevy's alsa-sys left with macroquad.
[workspace]
members = ["crates/cabin"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Turn everything up. I'm not a coward!
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Targeted allows (each one earns its place, like the ruff ignores did)
multiple_crate_versions = "allow" # Transitive deps disagree; not actionable here
missing_errors_doc = "allow" # Undocumented stuff is fine (the D10 of clippy)
missing_panics_doc = "allow" # Ditto
cast_precision_loss = "allow" # usize -> f32 in render math; the counts are tiny
cast_possible_truncation = "allow" # f32 -> i32 for pixel/window sizes is the point

[package]
name = "space-trucking"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Cassidy Prather <pratherea@gmail.com>"]
description = "Space Trucking — an ambient space-freight bartering toy"
readme = "README.md"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CassidyPrather/space-trucking"
keywords = ["game", "gamedev", "bevy", "space"]
categories = ["games"]
publish = false

[lib]
name = "space_trucking"
path = "src/lib.rs"

[[bench]]
name = "sim_bench"
harness = false

[dependencies]
fastrand = "2"

[dev-dependencies]
criterion = "0.7"

[lints]
workspace = true

[profile.release]
# Smaller, faster binaries at the cost of compile time
lto = "thin"
strip = "symbols"

# Dependencies get real optimization even in dev builds: Bevy at -O0 is
# unplayably slow.
[profile.dev.package."*"]
opt-level = 2

# Our own code gets light optimization too: the cabin's CRT screens are a
# CPU rasterizer repainting every frame, and -O0 made whole dev builds
# feel "way worse than such a simple game should" (playtest verdict).
# -O1 keeps edit-compile loops quick; `--release` is the way to *play*.
[profile.dev]
opt-level = 1
