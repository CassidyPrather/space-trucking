# ---------------------------------------------------------------------
# The fabric: walls, deck, deckhead, and what stands in the openings.
#
# The shell is dressed by ROLE rather than by kind — `fabric/wall` is
# every wall panel aboard, and `room::cladding` decides how many a wall
# needs and how wide each one is — so one table here dresses every room.
# A table with a `room` line beside its binding dresses that room kind
# alone, and wins over the table without one. That is how a room gets
# its own colour: Synty paint a whole pack from one atlas of flat
# swatches and ship the same atlas repainted six ways under
# `Textures/Alts`, so the cabin's wall and the furnace's wall are ONE
# mesh named twice, with two `texture` lines. The mesh is never
# repainted; the atlas is chosen (docs/ART_DIRECTION_3D.md, "Two voices").
#
# Every frame here is stated in docs/ART_PIPELINE.md, "The fabric
# namespace". The one thing to know reading the numbers: a wall panel's
# relief is squeezed nearly flat (`scale` on z), on purpose. This kit's
# panels carry a plinth at the floor line and a cornice under the
# deckhead that stand a fifth of a metre proud of the panel body, and
# the game hangs cargo on its walls with its back a hair in front of the
# hull — so the relief is held inside the notch the paint rides in, and
# the panel reads as panelling rather than as a shelf.
# ---------------------------------------------------------------------

