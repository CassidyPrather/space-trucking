name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  # Manual runs: an escape hatch when an event does not mint a run (a
  # push that modifies this very file can be withheld) and for ad-hoc
  # re-verification of any ref.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Install native dependencies
        # Bevy's cpal links ALSA and winit needs wayland/xkbcommon
        # headers. The runner image ships runtime .so.2 libraries but not
        # the dev symlinks and .pc files the build scripts need. libudev
        # was here for gilrs, and gilrs left with the gamepad feature —
        # nothing in the cabin ever read a pad.
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      # The art seam, which nothing above touches. `--features art` is off
      # by default and stays off everywhere else, so without these two
      # steps the only code in the repository that loads a purchased mesh
      # would compile nowhere and rot unlinted — and the first person to
      # turn the feature on would find out how long it had been broken.
      #
      # This still resolves no art and proves nothing about a Synty mesh:
      # the payload is not here. What it proves is that the seam compiles,
      # that its guards pass, and that the cabin's own glTF path reads a
      # binary glTF the test writes itself, byte by byte.
      #
      # Measured cost on a 4-core runner: about 25 s once the dependency
      # cache holds both feature sets (4 s of clippy, 21 s of tests). The
      # first run after this lands pays about 7 minutes, because the art
      # feature is a second compilation of Bevy's upper crates plus the
      # eight the glTF loader brings; Swatinem/rust-cache keeps that.
      - name: Lint the art seam with clippy
        run: cargo clippy -p cabin --features art --all-targets -- -D warnings

      - name: Test the art seam
        run: cargo test -p cabin --features art

      # The browser target, checked rather than built: nothing here
      # deploys to the web yet, so this proves the cheaper thing — that
      # the cabin still compiles for wasm32 at all, with the wasm-only
      # table in crates/cabin/Cargo.toml and nothing on the command line.
      # Without this step that table would rot the way the art seam would
      # have: nobody builds this target by accident, and the first person
      # to try would find out how long ago a Bevy feature edit broke it.
      #
      # Measured here: 3 min 18 s from cold with the registry warm, and
      # Swatinem/rust-cache keeps the wasm32 artifacts like any other.
      - name: Check the browser target compiles
        run: cargo check --target wasm32-unknown-unknown -p cabin

      - name: Enforce performance budgets
        # Release-only ceilings with wide headroom; see docs/BUDGETS.md.
        # -p: don't release-build the whole Bevy cabin just to time the sim.
        run: cargo test --release -p space-trucking --test perf -- --ignored

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: |
          # Just warnings for now...
          cargo audit || true

  build-and-publish:
    needs: lint-and-test
    if: github.event_name == 'release'
    permissions:
      contents: write  # Required for uploading release assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags for version detection

      - name: Install native dependencies
        # Linux only: Bevy's cpal needs the libasound symlink, winit the
        # wayland/xkbcommon headers. macOS and Windows use the system SDK.
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        # -p cabin: the 3D cabin is the game; its [[bin]] keeps the
        # space-trucking name so artifacts read the same as ever.
        run: cargo build --release --target ${{ matrix.target }} -p cabin

      - name: Package binary
        shell: bash
        run: |
          # Keep this in sync with the [[bin]] name in crates/cabin/Cargo.toml
          BIN="space-trucking"
          TARGET="${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "dist/${BIN}-${TARGET}.zip" "./target/${TARGET}/release/${BIN}.exe"
          else
            tar -czf "dist/${BIN}-${TARGET}.tar.gz" -C "target/${TARGET}/release" "${BIN}"
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
