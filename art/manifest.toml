# The rest of the cargo, in `Kind::index` order. Every line below came out
# of `cargo xtask art dex` — the catalogue is what knew which of a hundred
# files called `SM_Prop_Crate_0N` was the one worth naming here.
#
# Not dressed, and each for a stated reason. The window, porthole and bay
# window frame a rendered viewport a solid body would occlude; the chart
# tank, ETA gauge, destination preview and launch lever are the game's
# instruments, which is the UI.
#
# And the luminous paint, which is the fourth of this ship's light
# sources and the one no pack can sell. What it lights with is a PAINTED
# DECK CELL — a coat, and nobody models a coat. Its other body is a tin,
# and there is a fine blackout tin next to the paint tin's in POLYGON
# Construction (`SM_Prop_Paint_Can_Closed_Black_01`), but a `dresses`
# line names ONE mesh and a covering draws two (`Under::Laid` beside
# `Under::Packed`, `pieces::sync_dressings`), so a bought tin stands in
# the coat's place as well as the shelf's. Photographed, that is the
# glowing patch on the deck replaced by a can lying in the middle of the
# cell, and the laid coat is the only state in which luminous paint
# lights anything at all. The day a binding can name which of a
# covering's two bodies it is, the tin is a four-line table.
#
# The three lamps used to stand in this list too, on a reason that has
# gone: a purchased mesh replaces a description rather than joining it,
# so dressing one put the bay in the dark. The light is kept now and
# only the drawing is replaced — see below.

