# THE THREE LAMPS. Each owns a real `PointLight` that lights the ROOM
# rather than the body, and the room's light is not a drawing:
# `pieces::build_kind` keeps every part of a description that lights and
# drops only the parts that draw, so a bought lamp burns exactly where
# the whitebox's bulb burned and to the same reach.
#
# What a purchased lamp does NOT do is wake its own glass, and the
# reason has narrowed. It is no longer that a Synty mesh cannot be lit:
# the packs ship an emissive atlas beside the colour one and an
# `emissive` line declares it (`hangar_strip`, below). What is missing is
# the LEVEL — a glTF material is shared by every copy of its scene, so
# writing `sync_fixtures`'s eased value into one would light every lamp
# aboard at once. So a lamp aboard reads lit by the pool of light under
# it, and a lamp on the barter counter reads dark because there is no
# pool. Two of these three carry the glass as a node of their own —
# `SM_Prop_Lighting_Wall_Glass_05` and `SM_Prop_Lamp_01_Light_01` — so
# between an `emissive` line and a material instance per lamp, both
# halves are now named. See docs/ART_PIPELINE.md, "Light is not a
# drawing".

