<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Space Trucking — an ambient space-freight bartering toy.">
    <title>space trucking</title>
    <!-- Inline so the shell keeps making zero external requests (and the console
         keeps making zero 404s). A little freighter nosing toward a planet. -->
    <link rel="icon"
        href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAxNiAxNic+PHJlY3Qgd2lkdGg9JzE2JyBoZWlnaHQ9JzE2JyByeD0nMycgZmlsbD0nIzBkMGQxMicvPjxjaXJjbGUgY3g9JzEyJyBjeT0nNC41JyByPScyLjUnIGZpbGw9JyM0YWMyZTgnLz48cmVjdCB4PScyJyB5PSc4JyB3aWR0aD0nNycgaGVpZ2h0PSc0JyByeD0nMScgZmlsbD0nI2U4Yjg0YScvPjxwYXRoIGQ9J005IDhsNCAyLTQgMnonIGZpbGw9JyNlODczNGEnLz48L3N2Zz4=">
    <style>
        /* House shell: zero external requests. The canvas paints over #status
           once GL initializes; until then (or on failure) the status shows. */
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d12;
        }

        @media (prefers-color-scheme: light) {

            html,
            body {
                background: #e9e9ef;
            }
        }

        .center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 16px system-ui, sans-serif;
            color: #808090;
            text-align: center;
            padding: 0 2em;
        }

        #status {
            z-index: 0;
        }

        #status.loading::after {
            content: "\2026";
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.2;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #status.loading::after {
                animation: none;
            }
        }

        canvas#glcanvas {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
            z-index: 1;
        }

        /* The telemetry consent card (docs/TELEMETRY.md): meta-UI in the
           shell, so the game itself stays wordless. The overlay covers the
           canvas and swallows pointer events while a choice is pending; the
           wasm may boot and idle beneath it. Shown only while no choice is
           recorded — see the consent script below. */
        #consent {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(13, 13, 18, 0.55);
            font: 14px/1.45 system-ui, sans-serif;
        }

        #consent[hidden] {
            display: none;
        }

        .consent-card {
            max-width: 26em;
            margin: 1em;
            padding: 1.1em 1.3em;
            background: #16161d;
            color: #b8b8c4;
            border: 1px solid #2a2a33;
            border-radius: 8px;
        }

        .consent-card p {
            margin: 0 0 1em;
        }

        .consent-buttons {
            display: flex;
            gap: 0.6em;
        }

        /* Deliberately equal: declining is a first-class choice. */
        .consent-buttons button {
            flex: 1;
            font: inherit;
            color: inherit;
            background: #22222b;
            border: 1px solid #3a3a45;
            border-radius: 6px;
            padding: 0.5em 1em;
            cursor: pointer;
        }

        .consent-buttons button:hover,
        .consent-buttons button:focus-visible {
            background: #2a2a35;
        }

        @media (prefers-color-scheme: light) {
            #consent {
                background: rgba(233, 233, 239, 0.55);
            }

            .consent-card {
                background: #f6f6f9;
                color: #3a3a45;
                border-color: #c9c9d4;
            }

            .consent-buttons button {
                background: #e4e4ec;
                border-color: #b9b9c6;
            }

            .consent-buttons button:hover,
            .consent-buttons button:focus-visible {
                background: #d9d9e3;
            }
        }
    </style>
</head>

<body>
    <div id="status" class="center loading">loading</div>
    <noscript>
        <style>
            #status {
                display: none;
            }
        </style>
        <div class="center">This toy is WebAssembly in a canvas; it needs JavaScript to run.</div>
    </noscript>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <!-- Telemetry consent (docs/TELEMETRY.md): asked once, before first play,
         in the shell where translatable text is legitimate. The wording must
         stay aligned with that file: anonymous statistics, stored locally,
         sent nowhere today, choice cleared with site data. -->
    <div id="consent" lang="en" hidden>
        <div class="consent-card" role="dialog" aria-modal="true" aria-describedby="consent-text">
            <p id="consent-text">May this game keep anonymous play statistics?
                Coarse counts only &mdash; legs flown, trades made, time in
                flight &mdash; stored in this browser and sent nowhere. The
                game is identical either way, and clearing site data clears
                the choice.</p>
            <div class="consent-buttons">
                <button id="consent-yes">Yes, count them</button>
                <button id="consent-no">No, count nothing</button>
            </div>
        </div>
    </div>
    <!-- gl.js is miniquad's loader, vendored from the miniquad crate (see CREDITS.md).
         It grabs #glcanvas at parse time, so it must come after the canvas. -->
    <script src="gl.js"></script>
    <!-- audio.js is quad-snd's miniquad plugin, vendored likewise; macroquad's `audio`
         feature is useless on the web without it. Order is load-bearing: it calls
         gl.js's miniquad_add_plugin() at parse time, and its imports have to be
         registered before load() instantiates the wasm below. It also installs the
         first-gesture handler that resumes the audio context, which browsers keep
         suspended until the user presses something. -->
    <script src="audio.js"></script>
    <!-- sapp_jsutils.js is sapp-jsutils' miniquad plugin, vendored likewise; it owns
         the rust<->js object handoff. Same load-bearing order as audio.js: it calls
         miniquad_add_plugin() at parse time, so after gl.js and before load(). It
         must also come before quad-storage.js, which leans on its helpers. -->
    <script src="sapp_jsutils.js"></script>
    <!-- quad-storage.js is quad-storage's miniquad plugin, vendored likewise; it maps
         the storage extern fns onto localStorage, so without it saves have nowhere
         to go in the browser. Same rule: after sapp_jsutils.js, before load(). -->
    <script src="quad-storage.js"></script>
    <script>
        "use strict";
        // Reduced motion: the game gates its decorative animation on this
        // key (docs/ART_DIRECTION.md, Motion). Mirror the OS preference into
        // the localStorage key the wasm reads through quad-storage at boot:
        // '1' while reduced, removed otherwise. The change listener keeps
        // the mirror current if the OS setting flips mid-session, though the
        // game itself applies it on the next load.
        (() => {
            const KEY = "space-trucking/reduced-motion";
            const query = window.matchMedia("(prefers-reduced-motion: reduce)");
            const mirror = () => {
                try {
                    if (query.matches) {
                        localStorage.setItem(KEY, "1");
                    } else {
                        localStorage.removeItem(KEY);
                    }
                } catch (e) {
                    // Storage refused: the key stays as it was, and the
                    // game errs toward full motion.
                }
            };
            mirror();
            query.addEventListener("change", mirror);
        })();
    </script>
    <script>
        "use strict";
        const status = document.getElementById("status");
        function fail(message) {
            status.classList.remove("loading");
            status.textContent = message;
        }
        // gl.js reports some failures as errors and some as rejected promises
        window.addEventListener("error", (e) => fail("Something broke: " + e.message));
        window.addEventListener("unhandledrejection", (e) => fail("Failed to load: " + e.reason));
        if (typeof WebAssembly !== "object") {
            fail("This browser lacks WebAssembly support.");
        } else if (!document.createElement("canvas").getContext("webgl")) {
            fail("This browser lacks WebGL support.");
        } else {
            load("space-trucking.wasm"); // keep in sync with the [[bin]] name in Cargo.toml
            // Translucent draws write alpha into the framebuffer and let the
            // page show through — including this status line. Remove it once
            // the wasm is actually running (gl.js sets wasm_exports at
            // instantiation; on failure it never does, and the error handlers
            // above repurpose the element).
            const gone = setInterval(() => {
                if (window.wasm_exports) {
                    status.remove();
                    clearInterval(gone);
                }
            }, 100);
        }
    </script>
    <script>
        "use strict";
        // The consent card's one job: show itself only while no choice is
        // recorded, store the choice under the same localStorage key the
        // wasm reads through quad-storage (which maps keys 1:1), and get out
        // of the way. If localStorage is unavailable the card stays hidden
        // and telemetry stays off — no consent recorded means off, so the
        // failure mode is the private one.
        (() => {
            const card = document.getElementById("consent");
            const KEY = "space-trucking/telemetry-consent";
            let stored = null;
            try {
                stored = localStorage.getItem(KEY);
            } catch (e) {
                return;
            }
            if (stored !== null) return;
            const choose = (value) => {
                try {
                    localStorage.setItem(KEY, value);
                } catch (e) {
                    // Storage refused the write: the card still leaves, the
                    // choice just does not stick, and next load re-asks.
                }
                card.remove();
            };
            document.getElementById("consent-yes").addEventListener("click", () => choose("yes"));
            document.getElementById("consent-no").addEventListener("click", () => choose("no"));
            card.hidden = false;
        })();
    </script>
</body>

</html>
