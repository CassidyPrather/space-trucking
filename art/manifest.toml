# The cord between them, and **the one turned body in this file**. The
# pack ships a sagging velvet rope whose length runs along its own `z`;
# Venus's rope line runs along the room's `x`, so the mesh takes a
# quarter turn about `y` — and a quarter turn is what taught this
# pipeline that `scale` is per-axis in the MESH's frame while `half` is
# per-axis in the FRAME's. A trade room is 4.4 m across and 3.85 m deep,
# so the two axes the turn swaps are not the same length, and the old
# arithmetic wanted a `fill` of 23 on one of them — refused, and rightly.
# `Dressing::landing` turns the frame instead, so these numbers are the
# ordinary ones: `1 / measured_half`, and a fill of one.
#
# The sag goes. The whitebox rope is a straight bar 5.7 cm deep and this
# fills that box, which is the contract — a bought body occupies the
# space the cut one did. A rope allowed to droop out of its own box
# would be a station reaching somewhere its description does not.
