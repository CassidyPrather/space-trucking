# ---------------------------------------------------------------------
# The fittings: a station's own furniture.
#
# Cargo is dressed one mesh per kind and the shell one mesh per role.
# A station's furniture is dressed one mesh per **object**, and an object
# is a GROUP of `poi::Fitting`s — the ones sharing a `Fitting::part_of`
# name in that station's `Character::decor`. The Guild's shopfront is
# five brass bars and the rail they hang from; nobody sells a bar, so the
# thing a binding names is the shopfront.
#
# The name is the station's own spelling and then the object's
# (`art::piece_binding`), because a binding is `<namespace>/<name>` with
# no third part to put the station in, and fifteen stations would
# otherwise race for the word `counter`.
#
# The frame is the object's own box: the union of its pieces' bodies,
# floor-to-deckhead fractions of the room, carried into the world by
# `room::fit`. So the four numbers mean exactly what they mean in a
# berth — `scale` is mesh units per frame half-unit — and a module
# declared to fill its frame fills the space the whitebox object filled.
#
# **What is deliberately NOT dressed here, and why.** Not "because a
# bought body cannot glow" — it can, and `hangar_strip` below does. Synty
# ship an emissive atlas beside the colour one, an `emissive` line
# declares it, and the converter wires it into emission alone. What a
# bought body cannot do is glow in a colour somebody else chose.
#
# So the test is whether the fitting's meaning is its SHAPE or its HUE.
# A strip light is a strip light and a pack sells one. The Guild's
# seizure beacon burning `EERIE` is the hangar's own violet held one step
# off the omen's; Earth's grow strip is the dimmest green the palette
# carries, over a shelf that has not needed one in years; the Umbra's
# tins leak `LuminousPaint` at the rim because that is the good they buy
# at zero. Those are colours doing a job, and no atlas anybody sells does
# that job. Left cut, with the violet throat of the Guild's chute,
# Venus's picture light, Jupiter's pilot slit and furnace port, Neptune's
# rim lamps, and the Parlor's cove and its seven.
#
# **And the Wanderer is dressed nowhere at all.** Its pillars hold
# nothing up, its fourth collar has nothing under it, and its free-
# standing panel is "the only surface in the game with no visible way it
# was made" (`poi::wanderer`). A purchased body arrives with a way it was
# made written all over it, so buying one would answer the question the
# room exists to ask.
#
# Two constraints ride on every pick below and both come from the art
# direction: **no hazard striping**, which is `Consume`'s alone, and **no
# legible text**, which the zero-text law forbids anywhere a player can
# see it.
# ---------------------------------------------------------------------

# VENUS. A rope line across the front of the goods, and the two posts it
# hangs between: the salon buys its crowd control from the same catalogue
# the Parlor buys its chips from, which is the joke the two stations
# share. One mesh, two tables, because two posts are two objects — a
# module stands in one frame and there are two frames.
